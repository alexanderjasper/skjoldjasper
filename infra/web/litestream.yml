dbs:
  - path: /data/db.sqlite3
    replicas:
      - type: s3
        bucket: skjoldjasper-backups
        path: db
        endpoint: http://rclone:8080
        region: us-east-1
        force-path-style: true
        access-key-id: litestream
        secret-access-key: ${LITESTREAM_SECRET}
        # Keep ~30 days of restore points; ample for a personal site.
        retention: 720h
        retention-check-interval: 1h
        sync-interval: 1s
