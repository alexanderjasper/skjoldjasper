# skjoldjasper.dk — web service stack.
#
# Three containers:
#   web        — Django app served by gunicorn
#   litestream — streams /data/db.sqlite3 to the rclone S3 bridge
#   rclone     — exposes a pCloud WebDAV remote as an S3-compatible endpoint
#
# Dokploy reads this compose file directly. Secrets and host-specific
# env vars (SECRET_KEY, RCLONE_PCLOUD_*) are set in the Dokploy UI.

services:
  web:
    build:
      context: ../../apps/web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?required}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-skjoldjasper.dk}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://skjoldjasper.dk}
      DATABASE_URL: sqlite:////data/db.sqlite3
      # Consumed by `manage.py ensure_superuser` on boot; set in the Dokploy
      # UI for the first deploy, then safe to leave (the command no-ops once
      # a superuser exists).
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - web-data:/data
    expose:
      - "8000"
    # Join Dokploy's shared overlay network so Traefik can route to us.
    networks:
      - default
      - dokploy-network
    # Migrate + bootstrap an admin on every boot; both are idempotent
    # (migrations are no-ops when applied, ensure_superuser no-ops once a
    # superuser exists), so this is safe to run on every container start.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_superuser && exec gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - skjoldjasper.wsgi:application"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skjoldjasper.rule=Host(`skjoldjasper.dk`)"
      - "traefik.http.routers.skjoldjasper.entrypoints=web"
      - "traefik.http.services.skjoldjasper.loadbalancer.server.port=8000"
      # We only ever receive traffic through Cloudflare Tunnel, which terminates
      # TLS at the edge. Force X-Forwarded-Proto=https so Django stops redirecting.
      - "traefik.http.middlewares.skjoldjasper-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.skjoldjasper.middlewares=skjoldjasper-https"

  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      LITESTREAM_SECRET: ${LITESTREAM_SECRET:?required}
    volumes:
      - web-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate

  rclone:
    image: rclone/rclone:1.69
    restart: unless-stopped
    environment:
      # pCloud's native OAuth-based backend — WebDAV won't work alongside 2FA,
      # so we use the OAuth token generated locally via `rclone authorize pcloud`.
      RCLONE_CONFIG_PCLOUD_TYPE: pcloud
      RCLONE_CONFIG_PCLOUD_HOSTNAME: ${RCLONE_PCLOUD_HOSTNAME:-api.pcloud.com}
      RCLONE_CONFIG_PCLOUD_TOKEN: ${RCLONE_PCLOUD_TOKEN:?required}
    # `rclone serve s3` exposes the contents of pcloud:.backups/ as S3 buckets.
    # Litestream sees the `web-litestream` bucket and writes db/* into it,
    # producing pcloud:.backups/web-litestream/db/* on the remote. The leading
    # dot keeps the backup root hidden in pCloud's UI alongside the other
    # services' destinations under pcloudcrypt:.backups/.
    command: ["serve", "s3", "--addr", "0.0.0.0:8080", "--auth-key", "litestream,${LITESTREAM_SECRET:?required}", "pcloud:.backups"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "rclone", "lsd", "pcloud:", "--retries=1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  web-data:
    name: skjoldjasper-web-data

networks:
  # Dokploy's overlay network that hosts Traefik. Created by Dokploy's installer.
  dokploy-network:
    external: true
