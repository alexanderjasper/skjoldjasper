x-app: &app
  build:
    context: ../../src
  environment:
    ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=skjoldjasper;Username=skjoldjasper;Password=${POSTGRES_PASSWORD:?required}"

services:
  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["Skjoldjasper.Web.dll", "db-apply"]

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skjoldjasper.rule=Host(`skjoldjasper.dk`) && !Path(`/healthz`)"
      - "traefik.http.routers.skjoldjasper.entrypoints=web"
      - "traefik.http.services.skjoldjasper.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.skjoldjasper-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.skjoldjasper.middlewares=skjoldjasper-https"

  postgres:
    # Name pinned: the host backup script execs into this container by name.
    container_name: skjoldjasper_postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: skjoldjasper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: skjoldjasper
    # Postgres 18 refuses to start if this mounts /var/lib/postgresql/data.
    volumes:
      - web-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skjoldjasper"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  web-db:
    name: skjoldjasper-web-db

networks:
  dokploy-network:
    external: true
