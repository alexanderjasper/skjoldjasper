# Copy this file to infra/cloudflared/config.yml and replace placeholders.

# The Tunnel UUID you created in Cloudflare Zero Trust (Networks → Tunnels)
tunnel: YOUR_TUNNEL_UUID

# Path to the credentials JSON downloaded from Cloudflare when creating the tunnel
credentials-file: /etc/cloudflared/YOUR_TUNNEL_UUID.json

ingress:
  # Public web site
  - hostname: app.your-domain.com
    service: http://web:5173

  # Public game server (HTTP and WS)
  - hostname: ws.your-domain.com
    service: http://game-server:2567

  # Default - 404
  - service: http_status:404


