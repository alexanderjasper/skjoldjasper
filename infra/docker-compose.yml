name: skjoldjasper

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: skjoldjasper-postgres
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    ports:
      - "5433:5432"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    container_name: skjoldjasper-web
    working_dir: /workspace
    env_file:
      - ../apps/web/.env
    environment:
      - DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-app-password-change-me}@postgres:5432/${POSTGRES_DB:-appdb}
      - PUBLIC_GAME_SERVER_WS=${PUBLIC_GAME_SERVER_WS:-ws://localhost:2567}
      - CI=true
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  game-server:
    build:
      context: ..
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    container_name: skjoldjasper-game-server
    working_dir: /workspace
    environment:
      - DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-app-password-change-me}@postgres:5432/${POSTGRES_DB:-appdb}
      - CI=true
    ports:
      - "2567:2567"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [ "tunnel" ]
    restart: unless-stopped
    container_name: skjoldjasper-cloudflared
    command: [ "tunnel", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}" ]
    env_file:
      - ./.env
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      game-server:
        condition: service_started
    networks:
      - private

  pgbackrest:
    build:
      context: ./pgbackrest
      dockerfile: Dockerfile
    profiles: [ "backup" ]
    container_name: skjoldjasper-pgbackrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    networks:
      - private

volumes:
  postgres-data:
  postgres-run:
  pgbackrest-repo:
  pgbackrest-spool:

networks:
  private:
    driver: bridge


