name: skjoldjasper

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: skjoldjasper-postgres
    command: [
      "postgres",
      "-c", "wal_level=replica",
      "-c", "archive_mode=on",
      "-c", "archive_timeout=60s",
      "-c", "archive_command=pgbackrest --stanza=main archive-push %p"
    ]
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
      - pgbackrest-spool:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    # Dev-only: expose Postgres to host for local integration tests
    ports:
      - "5433:5432"

  web:
    image: node:22-alpine
    container_name: skjoldjasper-web
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm -w install --no-frozen-lockfile && pnpm -w --filter @skjoldjasper/shared --filter @skjoldjasper/db build && pnpm --filter web dev -- --host 0.0.0.0 --port 5173 --strictPort"
    env_file:
      - ../apps/web/.env
    environment:
      - DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-app-password-change-me}@postgres:5432/${POSTGRES_DB:-appdb}
      - PUBLIC_GAME_SERVER_WS=${PUBLIC_GAME_SERVER_WS:-ws://localhost:2567}
      - CI=true
    volumes:
      - ../:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  game-server:
    image: node:22-alpine
    container_name: skjoldjasper-game-server
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm -w install --no-frozen-lockfile && pnpm -w --filter @skjoldjasper/shared --filter @skjoldjasper/db build && pnpm --dir apps/game-server start"
    environment:
      - DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-app-password-change-me}@postgres:5432/${POSTGRES_DB:-appdb}
      - CI=true
    volumes:
      - ../:/workspace
      - /workspace/node_modules
      - /workspace/apps/game-server/node_modules
    ports:
      - "2567:2567"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  projector:
    image: node:22-alpine
    container_name: skjoldjasper-projector
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm -w install --no-frozen-lockfile && pnpm --dir apps/projector run"
    environment:
      - DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-app-password-change-me}@postgres:5432/${POSTGRES_DB:-appdb}
      - CI=true
    volumes:
      - ../:/workspace
      - /workspace/node_modules
      - /workspace/apps/projector/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skjoldjasper-cloudflared
    command: ["tunnel", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}"]
    env_file:
      - ./.env
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      game-server:
        condition: service_started
    networks:
      - private

  pgbackrest:
    build:
      context: ./pgbackrest
      dockerfile: Dockerfile
    profiles: ["backup"]
    container_name: skjoldjasper-pgbackrest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    networks:
      - private
    # Configuration for repository (R2/S3) will be added in step 5

volumes:
  postgres-data:
  postgres-run:
  pgbackrest-repo:
  pgbackrest-spool:

networks:
  private:
    driver: bridge


