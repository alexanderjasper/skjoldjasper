name: skjoldjasper

services:
  postgres:
    image: postgres:16-alpine
    container_name: skjoldjasper-postgres
    command: [
      "postgres",
      "-c", "wal_level=replica",
      "-c", "archive_mode=on",
      "-c", "archive_timeout=60s",
      "-c", "archive_command=pgbackrest --stanza=main archive-push %p"
    ]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    # Intentionally do not publish ports; DB remains private within the network

  pgbackrest:
    image: debian:bookworm-slim
    profiles: ["backup"]
    container_name: skjoldjasper-pgbackrest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    networks:
      - private
    # Configuration for repository (R2/S3) will be added in step 5

volumes:
  postgres-data:
  pgbackrest-repo:

networks:
  private:
    driver: bridge


