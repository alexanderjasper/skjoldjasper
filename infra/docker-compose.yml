name: skjoldjasper

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: skjoldjasper-postgres
    command: [
      "postgres",
      "-c", "wal_level=replica",
      "-c", "archive_mode=on",
      "-c", "archive_timeout=60s",
      "-c", "archive_command=pgbackrest --stanza=main archive-push %p"
    ]
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
      - pgbackrest-spool:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    # Dev-only: expose Postgres to host for local integration tests
    ports:
      - "5433:5432"

  pgbackrest:
    build:
      context: ./pgbackrest
      dockerfile: Dockerfile
    profiles: ["backup"]
    container_name: skjoldjasper-pgbackrest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    networks:
      - private
    # Configuration for repository (R2/S3) will be added in step 5

volumes:
  postgres-data:
  postgres-run:
  pgbackrest-repo:
  pgbackrest-spool:

networks:
  private:
    driver: bridge


