services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: skjoldjasper
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: skjoldjasper
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - skjoldjasper-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skjoldjasper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skjoldjasper-dev-db:
