<div class="split-line" style="display:flex;gap:.5rem;margin:.25rem 0;align-items:center">
    <select name="category" style="flex:1">
        <option value="">— pick category —</option>
        {% regroup leaves by parent.name as groups %}
        {% for group in groups %}
            {% if group.grouper %}
                <optgroup label="{{ group.grouper }}">
                    {% for leaf in group.list %}
                        <option value="{{ leaf.id }}"
                                {% if category_id|stringformat:"s" == leaf.id|stringformat:"s" %}selected{% endif %}>{{ leaf.name }}</option>
                    {% endfor %}
                </optgroup>
            {% else %}
                {% for leaf in group.list %}
                    <option value="{{ leaf.id }}"
                            {% if category_id|stringformat:"s" == leaf.id|stringformat:"s" %}selected{% endif %}>{{ leaf.name }}</option>
                {% endfor %}
            {% endif %}
        {% endfor %}
    </select>
    <input type="number" step="0.01" name="amount" value="{{ amount }}"
           placeholder="amount" class="split-amount"
           style="width:7rem;text-align:right;font-variant-numeric:tabular-nums">
    <button type="button"
            onclick="const f=this.closest('form'); this.closest('.split-line').remove(); recalcSplitTotal(f);"
            style="background:none;border:none;color:#a00;cursor:pointer;font-size:1.1em"
            title="Remove">✕</button>
</div>
