<tr id="tx-{{ tx.id }}" style="background:#f6f8fa">
    <td>{{ tx.date|date:"Y-m-d" }}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">{{ tx.amount }}</td>
    <td>{{ tx.description }}</td>
    <td>
        <form hx-post="{% url 'finance:split' tx.id %}"
              hx-target="closest tr" hx-swap="outerHTML"
              data-target="{{ tx.amount }}"
              oninput="recalcSplitTotal(this)"
              style="margin:0">
            {% csrf_token %}
            <div id="split-lines-{{ tx.id }}" class="split-lines">
                {% for cid, amt in lines %}
                    {% include "finance/_split_line.html" with category_id=cid amount=amt %}
                {% endfor %}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.5rem">
                <button type="button"
                        hx-get="{% url 'finance:split_line' tx.id %}"
                        hx-target="#split-lines-{{ tx.id }}" hx-swap="beforeend"
                        style="font-size:.9em">+ Add line</button>
                <span style="font-size:.9em">
                    Total <span class="split-total" style="font-variant-numeric:tabular-nums">0.00</span>
                    / <span style="font-variant-numeric:tabular-nums">{{ tx.amount }}</span>
                </span>
                <span>
                    <button type="submit" class="split-save" disabled>Save</button>
                    <a href="#" hx-get="{% url 'finance:row' tx.id %}"
                       hx-target="closest tr" hx-swap="outerHTML">Cancel</a>
                </span>
            </div>
        </form>
    </td>
</tr>
<script>
window.recalcSplitTotal = window.recalcSplitTotal || function(form) {
    const target = parseFloat(form.dataset.target);
    let total = 0;
    form.querySelectorAll('.split-amount').forEach(i => {
        const v = parseFloat(i.value);
        if (!isNaN(v)) total += v;
    });
    const totalEl = form.querySelector('.split-total');
    totalEl.textContent = total.toFixed(2);
    const match = Math.abs(total - target) < 0.01;
    totalEl.style.color = match ? '#070' : '#a00';
    form.querySelector('.split-save').disabled = !match;
};
recalcSplitTotal(document.querySelector('#tx-{{ tx.id }} form'));
</script>
