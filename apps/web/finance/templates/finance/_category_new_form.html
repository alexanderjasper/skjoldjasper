<tr style="background:var(--paper-sunk)">
    <td colspan="4" style="padding:.6rem .5rem .6rem {% widthratio depth 1 1 %}rem">
        <form method="post"
              action="{% url 'finance:category_create' year %}"
              style="display:flex;gap:.75rem;align-items:end;flex-wrap:wrap">
            {% csrf_token %}
            <label style="flex:2 1 12rem">Name<br>{{ new_form.name }}</label>
            <label style="flex:2 1 12rem">Parent<br>{{ new_form.parent }}</label>
            <label style="flex:1 1 8rem">Yearly target<br>{{ new_form.yearly_target }}</label>
            <label style="flex:0 1 4rem">Sort<br>{{ new_form.sort_order }}</label>
            <span style="display:flex;gap:.5rem;align-items:center">
                <button type="submit" style="padding:.45rem 1rem">Add</button>
                <a href="{% url 'finance:category_tree' year %}">Cancel</a>
            </span>
        </form>
    </td>
</tr>
